<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerRoyale - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #07090e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #0f141c;
            border: 1px solid #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .brand {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 800;
            color: #f59e0b;
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group {
            margin-bottom: 1.2rem;
        }
        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            background: #07090e;
            border: 1px solid #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus {
            border-color: #f59e0b;
        }
        .btn-submit {
            width: 100%;
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover {
            background: #d97706;
        }
        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
        .footer-text {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .footer-text a {
            color: #f59e0b;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand">
            <i class="fa-solid fa-crown"></i> POKER ROYALE
        </div>
        <div class="subtitle">Enter your credentials to access your account</div>

        <div id="alert-box" class="alert alert-error"></div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="login" class="form-control" placeholder="Enter username or email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn-submit">Log In</button>
        </form>

        <div class="footer-text">
            Don't have an account? <a href="register.html">Register Now</a>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';

            const loginVal = document.getElementById('login').value.trim();
            const passwordVal = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: loginVal, password: passwordVal })
                });

                const data = await res.json();

                if (!res.ok) {
                    alertBox.innerText = data.error || 'Login failed';
                    alertBox.style.display = 'block';
                    return;
                }

                // Store Token and User Info
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Redirect based on Admin role
                if (data.user.is_admin) {
                    window.location.href = 'admin.html';
                } else {
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                alertBox.innerText = 'Server connection error. Please try again.';
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
