<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerRoyale - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: #07090e;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: #0f141c;
            border: 1px solid #1e293b;
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }
        .brand {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 800;
            color: #f59e0b;
            text-align: center;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
        .form-control {
            width: 100%;
            background: #07090e;
            border: 1px solid #1e293b;
            padding: 12px 16px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus { border-color: #f59e0b; }
        .btn-submit {
            width: 100%;
            background: #f59e0b;
            color: #000;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 1rem;
        }
        .btn-submit:hover { background: #d97706; }
        .alert {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }
        .alert-error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }
        .alert-success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
        .footer-text { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #94a3b8; }
        .footer-text a { color: #f59e0b; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

    <div class="register-card">
        <div class="brand">
            <i class="fa-solid fa-crown"></i> POKER ROYALE
        </div>
        <div class="subtitle">Create your new player account & get $1,000 Free Bonus</div>

        <div id="alert-box" class="alert"></div>

        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Create a password" required>
            </div>
            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="footer-text">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        async function handleRegister(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alert-box');
            alertBox.style.display = 'none';
            alertBox.className = 'alert';

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    alertBox.innerText = data.error || 'Registration failed';
                    alertBox.classList.add('alert-error');
                    alertBox.style.display = 'block';
                    return;
                }

                alertBox.innerText = 'Registration successful! Redirecting to login...';
                alertBox.classList.add('alert-success');
                alertBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (err) {
                alertBox.innerText = 'Server connection error. Please try again.';
                alertBox.classList.add('alert-error');
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
