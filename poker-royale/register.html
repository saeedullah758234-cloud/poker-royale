<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — PokerRoyale</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600;700;800&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #1A1A2E; --accent: #E94560; --gold: #FFD700; --green: #00C853; 
            --bg-dark: #0A0A1A; --text: #FFFFFF; --text-muted: #8892B0;
            --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.1);
            --transition: all 0.3s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow-x: hidden; }
        a { text-decoration: none; color: var(--gold); }
        
        .auth-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .auth-bg img { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.12) saturate(1.3); }
        .auth-bg::after { content: ''; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(10,10,26,0.97), rgba(15,52,96,0.85), rgba(10,10,26,0.97)); }

        .auth-container { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1.1fr; max-width: 1050px; width: 95%; background: rgba(15,15,35,.7); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 24px; box-shadow: 0 40px 100px rgba(0,0,0,.5); overflow: hidden; }
        .auth-brand { background: linear-gradient(135deg, var(--primary), #0F3460); padding: 45px; display: flex; flex-direction: column; justify-content: center; }
        .logo { display: flex; align-items: center; gap: 12px; font-family: 'Cinzel', serif; font-size: 1.7rem; font-weight: 900; color: var(--gold); margin-bottom: 28px; }
        .brand-content h2 { font-family: 'Cinzel', serif; font-size: 1.9rem; font-weight: 900; margin-bottom: 14px; }
        .brand-content p { color: var(--text-muted); font-size: 0.92rem; margin-bottom: 28px; }

        .auth-form-panel { padding: 40px; }
        .form-header h2 { font-family: 'Cinzel', serif; font-size: 1.7rem; font-weight: 900; margin-bottom: 6px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 600; margin-bottom: 6px; }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .input-wrapper input { width: 100%; padding: 12px 14px 12px 42px; background: rgba(255,255,255,.04); border: 1.5px solid var(--glass-border); border-radius: 12px; color: var(--text); outline: none; transition: var(--transition); }
        .input-wrapper input:focus { border-color: var(--gold); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent), #FF6B6B); color: #fff; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; transition: var(--transition); margin-top: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(233,69,96,.3); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }

        /* OTP Section */
        #otpSection { display: none; text-align: center; }
        .otp-inputs { display: flex; justify-content: center; gap: 10px; margin: 20px 0; }
        .otp-inputs input { width: 45px; height: 50px; text-align: center; font-size: 1.5rem; font-family: 'Orbitron', sans-serif; font-weight: 700; background: rgba(255,255,255,.04); border: 1.5px solid var(--glass-border); border-radius: 10px; color: var(--gold); outline: none; }
        .otp-inputs input:focus { border-color: var(--gold); }

        .alert { padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; display: none; }
        .alert.error { background: rgba(233,69,96,.15); color: #FF6B6B; border: 1px solid rgba(233,69,96,.3); }
        .alert.success { background: rgba(0,200,83,.15); color: var(--green); border: 1px solid rgba(0,200,83,.3); }

        @media(max-width:900px){ .auth-container { grid-template-columns: 1fr; max-width: 500px; } .auth-brand { display: none; } }
    </style>
</head>
<body>

    <div class="auth-bg"><img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1920&q=80" alt="bg"></div>

    <div class="auth-container">
        <div class="auth-brand">
            <div class="logo"><i class="fas fa-crown"></i>Poker<span>Royale</span></div>
            <div class="brand-content">
                <h2>Join the <span style="color:var(--gold)">Winning Table</span></h2>
                <p>Register with your mobile number to ensure a secure real-money poker experience.</p>
            </div>
        </div>

        <div class="auth-form-panel">
            <div id="alertBox" class="alert"></div>

            <!-- REGISTRATION FORM -->
            <div id="registerSection">
                <div class="form-header">
                    <h2>Create Account 🃏</h2>
                    <p style="color:var(--text-muted); margin-bottom:20px;">Already have an account? <a href="login.html">Sign in here</a></p>
                </div>
                <form id="registerForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="fullName" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Email Address</label>
                            <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" required></div>
                        </div>
                        <div class="form-group">
                            <label>Mobile Number (with country code)</label>
                            <div class="input-wrapper"><i class="fas fa-phone"></i><input type="text" id="phone" placeholder="+923001234567" required></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Date of Birth</label>
                        <div class="input-wrapper"><i class="fas fa-calendar"></i><input type="date" id="dob" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="password" minlength="8" required></div>
                        </div>
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <div class="input-wrapper"><i class="fas fa-lock"></i><input type="password" id="confirmPassword" required></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-submit" id="btnRegister">Create Account <i class="fas fa-arrow-right"></i></button>
                </form>
            </div>

            <!-- OTP VERIFICATION SECTION -->
            <div id="otpSection">
                <div class="form-header">
                    <h2>Verify Mobile Number 📱</h2>
                    <p style="color:var(--text-muted); margin-bottom:20px;">We sent a 6-digit verification code to <strong id="displayPhone" style="color:var(--gold)"></strong></p>
                </div>
                <form id="otpForm">
                    <div class="otp-inputs">
                        <input type="text" maxlength="1" class="otp-char" required>
                        <input type="text" maxlength="1" class="otp-char" required>
                        <input type="text" maxlength="1" class="otp-char" required>
                        <input type="text" maxlength="1" class="otp-char" required>
                        <input type="text" maxlength="1" class="otp-char" required>
                        <input type="text" maxlength="1" class="otp-char" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btnVerify">Verify OTP</button>
                </form>
                <div style="margin-top: 20px;">
                    <a href="#" id="resendOtpBtn" style="font-size: 0.85rem;">Resend OTP</a>
                </div>
            </div>
        </div>
    </div>

    <!-- API Script -->
    <script src="js/api.js"></script>
    <script>
        let registeredPhone = '';

        const showAlert = (msg, isSuccess = false) => {
            const box = document.getElementById('alertBox');
            box.textContent = msg;
            box.className = `alert ${isSuccess ? 'success' : 'error'}`;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 5000);
        };

        // Handle Registration Submit
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const dob = document.getElementById('dob').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) return showAlert('Passwords do not match');
            
            // Age validation (18+)
            const age = Math.floor((new Date() - new Date(dob).getTime()) / 31557600000);
            if (age < 18) return showAlert('You must be at least 18 years old to register.');

            document.getElementById('btnRegister').disabled = true;
            document.getElementById('btnRegister').textContent = 'Processing...';

            try {
                const res = await AuthAPI.register({ fullName, email, phone, dob, password });
                if (res.success) {
                    registeredPhone = phone;
                    document.getElementById('displayPhone').textContent = phone;
                    document.getElementById('registerSection').style.display = 'none';
                    document.getElementById('otpSection').style.display = 'block';
                    showAlert('Account created! Please verify your mobile.', true);
                } else {
                    showAlert(res.message);
                }
            } catch (err) {
                showAlert(err.message || 'Registration failed');
            } finally {
                document.getElementById('btnRegister').disabled = false;
                document.getElementById('btnRegister').innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
            }
        });

        // OTP Input Auto-Advance
        const otpInputs = document.querySelectorAll('.otp-char');
        otpInputs.forEach((input, index) => {
            input.addEventListener('input', () => {
                input.value = input.value.replace(/[^0-9]/g, '');
                if (input.value.length === 1 && index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && input.value === '' && index > 0) {
                    otpInputs[index - 1].focus();
                }
            });
        });

        // Handle OTP Verification Submit
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = Array.from(otpInputs).map(i => i.value).join('');
            if (otp.length !== 6) return showAlert('Enter complete 6-digit OTP');

            document.getElementById('btnVerify').disabled = true;
            document.getElementById('btnVerify').textContent = 'Verifying...';

            try {
                const res = await AuthAPI.verifyOTP(registeredPhone, otp);
                if (res.success) {
                    showAlert('Mobile verified successfully! Redirecting to login...', true);
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showAlert(res.message);
                    document.getElementById('btnVerify').disabled = false;
                    document.getElementById('btnVerify').textContent = 'Verify OTP';
                }
            } catch (err) {
                showAlert(err.message || 'Verification failed');
                document.getElementById('btnVerify').disabled = false;
                document.getElementById('btnVerify').textContent = 'Verify OTP';
            }
        });

        // Handle Resend OTP
        document.getElementById('resendOtpBtn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                const res = await AuthAPI.resendOTP(registeredPhone);
                if (res.success) showAlert('A new OTP has been sent.', true);
                else showAlert(res.message);
            } catch (err) {
                showAlert(err.message || 'Failed to resend OTP');
            }
        });
    </script>
</body>
</html>
