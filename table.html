<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerRoyale - Live Multiplayer Table</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: #070b14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        .game-wrapper { display: flex; height: 100vh; width: 100vw; }

        /* ===== MAIN ARENA ===== */
        .arena {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at center, #151d30 0%, #05070e 100%);
        }

        /* Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: rgba(0,0,0,0.55);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 20;
        }
        .table-info h2 {
            color: #ffd700;
            font-size: 1.35rem;
            margin: 0;
            text-shadow: 0 2px 6px rgba(0,0,0,0.8);
        }
        .table-info p { color: #999; font-size: 0.85rem; margin-top: 2px; }
        .btn-leave {
            background: linear-gradient(to bottom, #e53935, #b71c1c);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .btn-leave:hover { filter: brightness(1.15); }

        /* Table Center */
        .table-center-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .poker-felt {
            width: 900px;
            height: 450px;
            background: radial-gradient(ellipse at center, #0e5a2b 0%, #063116 100%);
            border: 18px solid #2b170a;
            border-radius: 240px;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.85);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .board { text-align: center; z-index: 5; }
        .total-pot {
            background: rgba(0,0,0,0.85);
            padding: 8px 28px;
            border-radius: 22px;
            font-size: 1.3rem;
            color: #ffd700;
            font-weight: 900;
            border: 2px solid #b8860b;
            box-shadow: 0 0 18px rgba(184,134,11,0.45);
            margin-bottom: 14px;
            display: inline-block;
        }
        .cards-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            min-height: 90px;
        }

        /* Cards */
        .playing-card {
            width: 58px;
            height: 86px;
            background: #fff;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 6px;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.55);
        }
        .playing-card.red { color: #d32f2f; }
        .playing-card.black { color: #111; }
        .playing-card.hidden {
            background: repeating-linear-gradient(45deg, #1a2a6c, #1a2a6c 10px, #112255 10px, #112255 20px);
            border: 2px solid #fff;
        }
        .card-slot {
            width: 58px;
            height: 86px;
            border: 2px dashed rgba(255,255,255,0.22);
            border-radius: 6px;
        }

        /* Seats */
        .seat {
            position: absolute;
            width: 140px;
            height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 25;
        }
        #seat-0 { bottom: -55px; left: 50%; transform: translateX(-50%); }
        #seat-1 { bottom: 15px; left: 45px; }
        #seat-2 { top: 50%; left: -55px; transform: translateY(-50%); }
        #seat-3 { top: 15px; left: 45px; }
        #seat-4 { top: -55px; left: 50%; transform: translateX(-50%); }
        #seat-5 { top: 15px; right: 45px; }
        #seat-6 { top: 50%; right: -55px; transform: translateY(-50%); }
        #seat-7 { bottom: 15px; right: 45px; }
        #seat-8 { bottom: -55px; right: 22%; }

        .btn-sit {
            background: linear-gradient(180deg, #43a047, #1b5e20);
            color: #fff;
            border: 2px solid #66bb6a;
            padding: 10px 18px;
            border-radius: 28px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 0 16px rgba(76,175,80,0.65);
            transition: 0.25s;
        }
        .btn-sit:hover {
            transform: scale(1.1);
            box-shadow: 0 0 26px rgba(76,175,80,1);
        }

        .player-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .avatar-ring {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            padding: 3px;
            background: #333;
            position: relative;
            z-index: 2;
            box-shadow: 0 5px 12px rgba(0,0,0,0.5);
        }
        .avatar-ring.active-turn {
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            animation: pulse 1.5s infinite;
        }
        .avatar-ring img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #111;
            background: #222;
        }
        .dealer-button {
            position: absolute;
            top: -2px;
            right: -8px;
            background: #fff;
            color: #000;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #333;
            z-index: 5;
        }
        .info-plate {
            background: rgba(0,0,0,0.88);
            padding: 4px 12px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #444;
            margin-top: -8px;
            z-index: 3;
            min-width: 110px;
        }
        .info-plate .name {
            display: block;
            font-size: 0.8rem;
            color: #ddd;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .info-plate .chips {
            display: block;
            font-size: 0.9rem;
            color: #4caf50;
            font-weight: 900;
        }
        .pocket-cards {
            position: absolute;
            bottom: 55px;
            display: flex;
            gap: 2px;
            z-index: 1;
            transform: scale(0.55);
        }
        .current-bet-visual {
            position: absolute;
            top: -28px;
            font-size: 1rem;
            color: #ffd700;
            font-weight: bold;
            background: rgba(0,0,0,0.7);
            padding: 2px 10px;
            border-radius: 10px;
        }

        /* Timer Bar */
        .timer-bar-bg {
            width: 100%;
            height: 5px;
            background: #333;
            border-radius: 4px;
            margin-top: 4px;
            overflow: hidden;
            display: none;
        }
        .active-turn .timer-bar-bg { display: block; }
        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #4caf50;
            transition: width 1s linear;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(255, 215, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
        }

        /* Winner Banner */
        .winner-overlay {
            position: absolute;
            top: 28%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 215, 0, 0.95);
            padding: 14px 40px;
            border-radius: 30px;
            font-size: 1.6rem;
            font-weight: 900;
            color: #000;
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            text-align: center;
            max-width: 80%;
        }

        /* Action Panel */
        .controls {
            background: #0f172a;
            padding: 16px 20px;
            border-top: 2px solid #1e293b;
            display: none;
            align-items: center;
            gap: 12px;
            justify-content: center;
            z-index: 30;
        }
        .action-btn {
            flex: 1;
            max-width: 140px;
            padding: 14px 10px;
            font-size: 1rem;
            font-weight: 900;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.1s;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-fold { background: linear-gradient(180deg, #e53935, #b71c1c); box-shadow: 0 4px 0 #7f0000; }
        .btn-check { background: linear-gradient(180deg, #1e88e5, #0d47a1); box-shadow: 0 4px 0 #002171; }
        .btn-call { background: linear-gradient(180deg, #43a047, #1b5e20); box-shadow: 0 4px 0 #003300; }
        .btn-raise { background: linear-gradient(180deg, #fdd835, #f57f17); color: #000; box-shadow: 0 4px 0 #bc5100; }

        .raise-container {
            display: flex;
            flex-direction: column;
            flex: 2;
            max-width: 380px;
            gap: 8px;
        }
        .raise-shortcuts { display: flex; gap: 5px; }
        .btn-shortcut {
            flex: 1;
            background: #1e293b;
            color: white;
            border: 1px solid #334155;
            padding: 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.8rem;
        }
        .btn-shortcut:hover { background: #334155; }
        .raise-slider-wrapper { display: flex; align-items: center; gap: 10px; }
        input[type=range] { flex: 1; cursor: pointer; }
        input[type=number] {
            width: 90px;
            padding: 8px;
            background: #000;
            color: #0f0;
            border: 1px solid #333;
            border-radius: 5px;
            font-weight: bold;
            font-size: 1rem;
            text-align: center;
        }

        /* Buy-In Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(6px);
        }
        .buyin-box {
            background: linear-gradient(180deg, #1e293b, #0f172a);
            width: 400px;
            padding: 30px;
            border-radius: 16px;
            border: 2px solid #ffd700;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,1);
        }
        .buyin-box h3 { color: #ffd700; font-size: 1.7rem; margin-bottom: 8px; }
        .buyin-box p { color: #aaa; margin-bottom: 18px; font-size: 0.95rem; }
        .buyin-input-group {
            background: #000;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
        .buyin-input-group input {
            width: 100%;
            background: transparent;
            border: none;
            color: #4caf50;
            font-size: 2.4rem;
            font-weight: bold;
            text-align: center;
            outline: none;
        }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btns button {
            flex: 1;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }
        .btn-cancel { background: #333; color: white; }
        .btn-confirm { background: #ffd700; color: black; }

        /* Sidebar Chat */
        .sidebar {
            width: 300px;
            background: #0f172a;
            border-left: 2px solid #1e293b;
            display: flex;
            flex-direction: column;
        }
        .chat-title {
            padding: 14px;
            background: #162032;
            font-size: 1.05rem;
            font-weight: bold;
            color: #ffd700;
            border-bottom: 1px solid #1e293b;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .chat-box {
            flex: 1;
            padding: 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.88rem;
        }
        .msg .author { color: #3b82f6; font-weight: bold; }
        .msg.system { color: #888; font-style: italic; text-align: center; }
        .chat-form {
            display: flex;
            padding: 10px;
            background: #162032;
            border-top: 1px solid #1e293b;
        }
        .chat-form input {
            flex: 1;
            padding: 10px;
            border-radius: 6px 0 0 6px;
            border: none;
            background: #000;
            color: white;
            outline: none;
        }
        .chat-form button {
            padding: 10px 14px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 0 6px 6px 0;
            cursor: pointer;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .poker-felt { width: 700px; height: 360px; }
            .sidebar { width: 260px; }
        }
    </style>
</head>
<body>

    <!-- Buy-In Modal -->
    <div class="modal-overlay" id="modal-buyin">
        <div class="buyin-box">
            <h3>Buy-In to Table</h3>
            <p>Select chips to bring to the table</p>
            <div class="buyin-input-group">
                <input type="number" id="buyin-amount" value="500" min="50" max="50000" step="50">
            </div>
            <div class="modal-btns">
                <button class="btn-cancel" id="btn-buyin-cancel">Cancel</button>
                <button class="btn-confirm" id="btn-buyin-confirm">Sit Down</button>
            </div>
        </div>
    </div>

    <div class="game-wrapper">
        <!-- Main Arena -->
        <div class="arena">
            <div class="top-bar">
                <div class="table-info">
                    <h2 id="table-name">VIP Texas Hold'em</h2>
                    <p>Blinds: $5 / $10 • Multiplayer Live</p>
                </div>
                <button class="btn-leave" id="btn-leave">
                    <i class="fa-solid fa-right-from-bracket"></i> Leave Table
                </button>
            </div>

            <div class="table-center-wrapper">
                <!-- Winner Banner -->
                <div class="winner-overlay" id="winner-banner">Winner!</div>

                <div class="poker-felt">
                    <div class="board">
                        <div class="total-pot">POT: <span id="pot-amount">$0.00</span></div>
                        <div class="cards-row" id="board-cards">
                            <div class="card-slot"></div>
                            <div class="card-slot"></div>
                            <div class="card-slot"></div>
                            <div class="card-slot"></div>
                            <div class="card-slot"></div>
                        </div>
                    </div>

                    <!-- 9 Seats -->
                    <div id="seat-0" class="seat"><button class="btn-sit" data-seat="0">+ SIT HERE</button></div>
                    <div id="seat-1" class="seat"><button class="btn-sit" data-seat="1">+ SIT HERE</button></div>
                    <div id="seat-2" class="seat"><button class="btn-sit" data-seat="2">+ SIT HERE</button></div>
                    <div id="seat-3" class="seat"><button class="btn-sit" data-seat="3">+ SIT HERE</button></div>
                    <div id="seat-4" class="seat"><button class="btn-sit" data-seat="4">+ SIT HERE</button></div>
                    <div id="seat-5" class="seat"><button class="btn-sit" data-seat="5">+ SIT HERE</button></div>
                    <div id="seat-6" class="seat"><button class="btn-sit" data-seat="6">+ SIT HERE</button></div>
                    <div id="seat-7" class="seat"><button class="btn-sit" data-seat="7">+ SIT HERE</button></div>
                    <div id="seat-8" class="seat"><button class="btn-sit" data-seat="8">+ SIT HERE</button></div>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="controls" id="action-panel">
                <button class="action-btn btn-fold" id="btn-fold">FOLD</button>
                <button class="action-btn btn-check" id="btn-check">CHECK</button>
                <button class="action-btn btn-call" id="btn-call">CALL $0</button>

                <div class="raise-container">
                    <div class="raise-shortcuts">
                        <button class="btn-shortcut" id="btn-raise-min">Min</button>
                        <button class="btn-shortcut" id="btn-raise-half">1/2 Pot</button>
                        <button class="btn-shortcut" id="btn-raise-pot">Pot</button>
                        <button class="btn-shortcut" id="btn-raise-max">Max</button>
                    </div>
                    <div class="raise-slider-wrapper">
                        <input type="range" id="raise-slider" min="10" max="1000" step="1" value="20">
                        <input type="number" id="raise-input" value="20">
                    </div>
                </div>

                <button class="action-btn btn-raise" id="btn-raise">RAISE</button>
            </div>
        </div>

        <!-- Sidebar Chat -->
        <div class="sidebar">
            <div class="chat-title"><i class="fa-solid fa-comments"></i> Table Chat</div>
            <div class="chat-box" id="chat-box">
                <div class="msg system">Dealer: Welcome to PokerRoyale VIP Table!</div>
            </div>
            <form class="chat-form" id="chat-form">
                <input type="text" id="chat-input" placeholder="Type a message..." autocomplete="off">
                <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="currency-override.js"></script>
    <script src="js/poker-engine-client.js"></script>
</body>
</html>
